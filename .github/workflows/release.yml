name: Draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag, e.g. v1.7.0 (draft only)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: draft-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Test
        run: ./scripts/test.sh
      - name: Build universal release app
        id: build
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./scripts/build.sh "$RELEASE_TAG"
      - name: Sign, notarize and package ZIP and DMG
        uses: acheronfail/dist-tools/actions/apple-release@v1
        with:
          app-path: ${{ steps.build.outputs.app-path }}
          bundle-id: fail.acheron.pixel-picker
          output-archive: ${{ steps.build.outputs.archive }}
          output-disk-image: ${{ steps.build.outputs.disk-image }}
          signing-plan: ${{ steps.build.outputs.signing-plan }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}
          p12-base64: ${{ secrets.MACOS_CODE_SIGN_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CODE_SIGN_P12_PASSWORD }}
          notary-auth-mode: ${{ vars.APPLE_NOTARY_AUTH_MODE || 'apple-id' }}
          notary-api-key: ${{ (vars.APPLE_NOTARY_AUTH_MODE == 'api-team' || vars.APPLE_NOTARY_AUTH_MODE == 'api-individual') && secrets.APPLE_NOTARY_API_KEY || '' }}
          notary-key-id: ${{ (vars.APPLE_NOTARY_AUTH_MODE == 'api-team' || vars.APPLE_NOTARY_AUTH_MODE == 'api-individual') && secrets.APPLE_NOTARY_KEY_ID || '' }}
          notary-issuer-id: ${{ vars.APPLE_NOTARY_AUTH_MODE == 'api-team' && secrets.APPLE_NOTARY_ISSUER_ID || '' }}
          notary-apple-id: ${{ (vars.APPLE_NOTARY_AUTH_MODE == 'apple-id' || vars.APPLE_NOTARY_AUTH_MODE == '') && secrets.APPLE_NOTARY_APPLE_ID || '' }}
          notary-password: ${{ (vars.APPLE_NOTARY_AUTH_MODE == 'apple-id' || vars.APPLE_NOTARY_AUTH_MODE == '') && secrets.APPLE_NOTARY_PASSWORD || '' }}
          notary-timeout: 30m
          ticket-network-workaround: 'true'
      - name: Generate checksums for final packages
        env:
          ARTIFACT_NAME: ${{ steps.build.outputs.name }}
        run: |
          cd dist
          shasum -a 256 "$ARTIFACT_NAME.zip" "$ARTIFACT_NAME.dmg" > "$ARTIFACT_NAME-SHA256SUMS.txt"
      - name: Generate and verify signed Sparkle feed
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: ./scripts/generate-appcast.sh "$RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PixelPicker-${{ inputs.tag }}-universal
          path: |
            dist/*-universal.zip
            dist/*-universal.dmg
            dist/*-SHA256SUMS.txt
            dist/appcast.xml
          if-no-files-found: error
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          # gh release create fails if a release already exists; never edit or publish one.
          gh release create "$RELEASE_TAG" dist/*-universal.zip dist/*-universal.dmg dist/*-SHA256SUMS.txt dist/appcast.xml \
            --draft --verify-tag --title "Pixel Picker $RELEASE_TAG" --generate-notes
